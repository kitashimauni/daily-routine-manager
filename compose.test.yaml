services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: routine_test
      POSTGRES_USER: routine_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine_test -d routine_test"]
      interval: 3s
      timeout: 5s
      retries: 20
